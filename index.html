<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ECHO//NULL</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="scanlines"></div>

<main class="terminal">

    <header class="terminal-header">

        <div class="status">
            <span class="status-dot"></span>
            SYSTEM ONLINE
        </div>

        <div class="title">
            ECHO<span>//</span>NULL
        </div>

        <div class="version">
            v4.0.0
        </div>

    </header>


    <section class="screen" id="screen">

        <div class="boot">

            <p>BOOT SEQUENCE INITIATED...</p>
            <p>Loading kernel...</p>
            <p>Loading memory sectors...</p>
            <p>Checking integrity...</p>

            <p class="warning">
                WARNING: MEMORY CORRUPTION DETECTED
            </p>

            <p>
                Unknown process detected.
            </p>

            <p>
                Connection established.
            </p>

            <br>

            <p>
                Type
                <span class="command">help</span>
                to begin.
            </p>

        </div>

    </section>


    <form id="terminalForm" class="input-area">

        <span class="prompt">
            guest@echo-null:~$
        </span>

        <input
            id="commandInput"
            type="text"
            autocomplete="off"
            spellcheck="false"
            autofocus
        >

    </form>

</main>


<div id="glitch"></div>

<script src="script.js"></script>

</body>
</html>
